name: Terraform

# Format and validate only. Applies run by hand (see README): bootstrap/
# creates the role the image build uses and runners/ holds the GitHub App's
# private key, so CI never holds rights to either.

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/**'
      - 'runners/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    paths:
      - 'bootstrap/**'
      - 'runners/**'
      - '.github/workflows/terraform.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ matrix.stack }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        stack: [bootstrap, runners]
    defaults:
      run:
        working-directory: ${{ matrix.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1

      - run: terraform fmt -check -diff -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
